[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "copilot-usage-visualizer"
version = "0.1.0"
description = "Local Copilot usage log scanner and report tool."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["dearpygui>=2.3,<3", "jinja2>=3.1", "plotly==6.8.0"]

[project.scripts]
copilot-usage = "copilot_usage_visualizer.cli:main"
copilot-usage-gui = "copilot_usage_visualizer.gui_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_usage_visualizer"]
